[project]
name = "multi-agent-investment-advisor"
version = "0.1.0"
description = "LangGraph-based FinFlow multi-agent investment advisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "openai",
  "google-genai",
  "python-dotenv",
  "pydantic>=2.0",
  "pydantic-settings>=2.7",
  "SQLAlchemy>=2.0",
  "alembic",
  "chromadb",
  "sentence-transformers",
  "numpy",
  "scipy",
  "rich",
  "pytest",
  "pytest-asyncio",
  "langgraph",
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest-cov"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
advisor = "app.main:main"
advisor-web = "app.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
